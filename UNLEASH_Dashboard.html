        }

        }

            color: #000000;
            font-size: 28px;
        }

            color: #ffffff;

            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;

            transform: translateY(-4px);
        }

            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: #000000;
            opacity: 0;
            transition: opacity 0.3s;

            margin-bottom: 6px;

            top: 0;

            height: 100%;

        }

            justify-content: center;

            }

            right: 30px;

            }

            .filters {

            }

                padding: 40px 30px;
            }

            .modal-title {
                font-size: 26px;
            }

                padding: 20px;
            }
        }
    </style>
</head>

        let filteredSessions = [...sessionsData];

        // Initialize filters
        function initializeFilters() {
            const dates = [...new Set(sessionsData.map(s => s.Date))].filter(d => d);
            const stages = [...new Set(sessionsData.map(s => s.Stage))].filter(s => s);
            const types = [...new Set(sessionsData.map(s => s.Type))].filter(t => t);
            const topics = [...new Set(sessionsData.map(s => s.Topic))].filter(t => t);

            populateSelect('dateFilter', dates);
            populateSelect('stageFilter', stages);
            populateSelect('typeFilter', types);
            populateSelect('topicFilter', topics);
        }

        function populateSelect(selectId, options) {
            const select = document.getElementById(selectId);
            options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option;
                opt.textContent = option;
                select.appendChild(opt);
            });
        }

        // Filter sessions
        function filterSessions() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const dateFilter = document.getElementById('dateFilter').value;
            const stageFilter = document.getElementById('stageFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            const topicFilter = document.getElementById('topicFilter').value;

            filteredSessions = sessionsData.filter(session => {
                const matchesSearch = !searchTerm || 
                    session.Title.toLowerCase().includes(searchTerm) ||
                    session.Speaker.toLowerCase().includes(searchTerm) ||
                    session['Session Introduction'].toLowerCase().includes(searchTerm) ||
                    session['Session Abstract'].toLowerCase().includes(searchTerm);

                const matchesDate = !dateFilter || session.Date === dateFilter;
                const matchesStage = !stageFilter || session.Stage === stageFilter;
                const matchesType = !typeFilter || session.Type === typeFilter;
                const matchesTopic = !topicFilter || session.Topic === topicFilter;

                return matchesSearch && matchesDate && matchesStage && matchesType && matchesTopic;
            });

            renderSessions();
        }

        // Render sessions
        function renderSessions() {
            const container = document.getElementById('sessionsContainer');
            const resultCount = document.getElementById('resultCount');

            resultCount.textContent = filteredSessions.length;

            if (filteredSessions.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <h2>No sessions found</h2>
                        <p>Please adjust your filters or search terms</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredSessions.map((session, index) => `
                <div class="session-card" onclick="openModal(${index})">
                    <div class="session-type">${session.Type}</div>
                    <div class="session-time">
                        ${session.Date} | ${session.Begin} - ${session.End}
                    </div>
                    <div class="session-title">${session.Title}</div>
                    ${session.Speaker ? `<div class="session-speaker">${session.Speaker.replace(/\n\/\n/g, ' / ')}</div>` : ''}
                    ${session.Affiliation ? `<div class="session-affiliation">${session.Affiliation.replace(/\n\/\n/g, ' / ')}</div>` : ''}
                    <div class="session-meta">
                        <span class="meta-badge">${session.Stage}</span>
                        <span class="meta-badge">${session.Topic}</span>
                    </div>
                    ${session['Session Introduction'] ? `<div class="session-intro">${session['Session Introduction']}</div>` : ''}
                </div>
            `).join('');
        }

        // Open modal with session details
        function openModal(index) {
            const session = filteredSessions[index];
            const modal = document.getElementById('sessionModal');
            const modalBody = document.getElementById('modalBody');

            // Parse Key Takeaways if it contains bullet points
            let keyTakeawaysHtml = '';
            if (session['Key Takeaways']) {
                const takeaways = session['Key Takeaways'].split('\n').filter(t => t.trim());
                if (takeaways.length > 1) {
                    keyTakeawaysHtml = '<ul>' + takeaways.map(t => `<li>${t.replace(/^[*-]\s*/, '')}</li>`).join('') + '</ul>';
                } else {
                    keyTakeawaysHtml = `<p>${session['Key Takeaways']}</p>`;
                }
            }

            // Format speaker info with slashes displayed properly
            let speakerHtml = '';
            if (session.Speaker) {
                const speakers = session.Speaker.split('\n/\n');
                const positions = session.Position ? session.Position.split('\n/\n') : [];
                const affiliations = session.Affiliation ? session.Affiliation.split('\n/\n') : [];

                speakerHtml = speakers.map((speaker, idx) => {
                    let html = `<div class="session-speaker" style="font-size: 17px; margin-top: 16px;">${speaker.trim()}</div>`;
                    if (positions[idx]) {
                        html += `<div style="color: #5c5c5c; font-size: 15px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">${positions[idx].trim()}</div>`;
                    }
                    if (affiliations[idx]) {
                        html += `<div class="session-affiliation">${affiliations[idx].trim()}</div>`;
                    }
                    return html;
                }).join('');
            }

            modalBody.innerHTML = `
                <div class="modal-header">
                    <div class="session-type">${session.Type}</div>
                    <div class="modal-title">${session.Title}</div>
                    <div class="session-time" style="font-size: 15px;">
                        ${session.Date} | ${session.Begin} - ${session.End}
                    </div>
                    ${speakerHtml}
                    <div class="modal-meta">
                        <span class="meta-badge">${session.Stage}</span>
                        <span class="meta-badge">${session.Topic}</span>
                    </div>
                </div>

                ${session['Session Introduction'] ? `
                    <div class="modal-section">
                        <h3>Introduction</h3>
                        <p>${session['Session Introduction']}</p>
                    </div>
                ` : ''}

                ${session['Session Abstract'] ? `
                    <div class="modal-section">
                        <h3>Abstract</h3>
                        <p>${session['Session Abstract']}</p>
                    </div>
                ` : ''}

                ${session['Session Purpose'] ? `
                    <div class="modal-section">
                        <h3>Purpose</h3>
                        <p>${session['Session Purpose']}</p>
                    </div>
                ` : ''}

                ${session['Key Takeaways'] ? `
                    <div class="modal-section">
                        <h3>Key Takeaways</h3>
                        ${keyTakeawaysHtml}
                    </div>
                ` : ''}
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';

            // Scroll to top of modal content
            modal.scrollTop = 0;
        }

        // Close modal
        function closeModal() {
            const modal = document.getElementById('sessionModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Close modal when clicking outside
        function closeModalOnOutsideClick(event) {
            if (event.target.classList.contains('modal-wrapper')) {
                closeModal();
            }
        }

        // Close modal with ESC key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // Reset filters
        function resetFilters() {
            document.getElementById('searchBox').value = '';
            document.getElementById('dateFilter').value = '';
            document.getElementById('stageFilter').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('topicFilter').value = '';
            filterSessions();
        }

        // Event listeners
        document.getElementById('searchBox').addEventListener('input', filterSessions);
        document.getElementById('dateFilter').addEventListener('change', filterSessions);
        document.getElementById('stageFilter').addEventListener('change', filterSessions);
        document.getElementById('typeFilter').addEventListener('change', filterSessions);
        document.getElementById('topicFilter').addEventListener('change', filterSessions);

        // Initialize on page load
        initializeFilters();
        filterSessions();
    </script>
